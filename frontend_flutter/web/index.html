<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gravigram Telegram Mini App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gravigram">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gravigram Mini App</title>
  <link rel="manifest" href="manifest.json">
  <!-- Telegram WebApp JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Force unregister all legacy service workers & clear caches to prevent stale bundles
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }

    function saveTelegramContext() {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          var initData = window.Telegram.WebApp.initData;
          if (initData) {
            window.tgInitData = initData;
            sessionStorage.setItem('tg_init_data', initData);
            localStorage.setItem('tg_init_data', initData);
          }
        }
      } catch (e) {
        console.error("TMA ready error:", e);
      }
    }
    saveTelegramContext();
    window.addEventListener('DOMContentLoaded', saveTelegramContext);
    window.addEventListener('load', saveTelegramContext);
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=20261007_v3" async></script>
</body>
</html>
