services:
  antigravity-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity_hub
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persistent SQLite database and active session store
      - ./data:/app/data
      # Workspaces and project directories
      - ./projects:/app/projects
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/status || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
