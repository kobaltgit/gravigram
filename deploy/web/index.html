<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Antigravity Telegram Mini App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Antigravity">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Antigravity Mini App</title>
  <link rel="manifest" href="manifest.json">
  <!-- Telegram WebApp JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    function saveTelegramContext() {
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          var initData = window.Telegram.WebApp.initData;
          if (initData) {
            window.tgInitData = initData;
            sessionStorage.setItem('tg_init_data', initData);
            localStorage.setItem('tg_init_data', initData);
          }
        }
      } catch (e) {
        console.error("TMA ready error:", e);
      }
    }
    saveTelegramContext();
    window.addEventListener('DOMContentLoaded', saveTelegramContext);
    window.addEventListener('load', saveTelegramContext);
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js?v=2" async></script>
</body>
</html>
